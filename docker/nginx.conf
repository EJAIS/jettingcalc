# nginx server config for the jettingcalc container image (see Dockerfile).
# Replaces the base image's /etc/nginx/conf.d/default.conf.
#
# The app is static and uses relative paths only, so it is served both at
# the root (`/`, for a reverse proxy that strips its path prefix) and under
# `/jettingcalc/` (for a reverse proxy that forwards the path unchanged,
# matching the public URL ejais.de/jettingcalc/).

# Response headers that are not under the repo's control otherwise; see
# README, section "Deployment". An empty value means nginx omits the header.
map $uri $jettingcalc_cache_control {
    # sw.js must never be long-cached, or browsers miss app updates.
    ~/sw\.js$       "no-cache";
    # The app shell (`/` and index.html) is revalidated on every load.
    ~/$             "no-cache";
    ~/index\.html$  "no-cache";
    default         "";
}

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;
    # Redirects (e.g. /jettingcalc -> /jettingcalc/) stay relative, so they
    # are correct behind a reverse proxy with a different host or scheme.
    absolute_redirect off;

    add_header Cache-Control           $jettingcalc_cache_control;
    add_header X-Content-Type-Options  "nosniff";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json
                    application/manifest+json image/svg+xml;

    # Container health check (Dockerfile HEALTHCHECK); kept out of the log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same files under the subdirectory the public deployment uses. The
    # internal rewrite keeps the browser URL (and with it the service
    # worker scope) at /jettingcalc/.
    location = /jettingcalc {
        return 301 /jettingcalc/;
    }
    location /jettingcalc/ {
        rewrite ^/jettingcalc/(.*)$ /$1 last;
    }

    # Spec-correct manifest MIME type (nginx serves .json as
    # application/json by default).
    location = /manifest.json {
        types { }
        default_type application/manifest+json;
    }

    # No SPA fallback: views use the URL hash, so a mistyped path keeps
    # returning the server's 404 (see CLAUDE.md, "PWA / Service Worker").
    location / {
        try_files $uri $uri/ =404;
    }
}
