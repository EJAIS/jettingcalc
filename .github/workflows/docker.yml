# Builds the container image (Dockerfile) and publishes it to
# ghcr.io/<owner>/jettingcalc. Usage on the server: README, section "Docker".
#
# - Pull requests: unit tests, image build and smoke test, no push.
# - Push to main: same, then push :latest, :main and :sha-<short>.
# - Tag v1.2.3: push :1.2.3, :1.2 (and :latest stays on main).
# Base image updates arrive as Dependabot pull requests (Dockerfile pins
# tag + digest), so merging one is a normal push to main.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same gate as before every merge (CLAUDE.md, "Tests"); includes the
      # check that JETTINGCALC_CACHE_VERSION matches the shipped files.
      - name: Unit tests
        run: node --test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jettingcalc:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eu
          docker run -d --name smoke -p 8080:8080 jettingcalc:smoke
          trap 'docker logs smoke; docker rm -f smoke >/dev/null' EXIT
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 0.5
          done
          # Every precached file (sw.js PRECACHE_URLS) and sw.js itself,
          # at the root and under /jettingcalc/.
          urls=$(node --input-type=module -e "
            const { PRECACHE_URLS } = await import('./sw.js');
            console.log([...PRECACHE_URLS, './sw.js'].map(u => u.slice(2)).join('\n'));
          ")
          for prefix in / /jettingcalc/; do
            for u in $urls; do
              curl -fsS -o /dev/null "http://127.0.0.1:8080${prefix}${u}"
            done
          done
          curl -fsSI http://127.0.0.1:8080/manifest.json | grep -qi '^content-type: application/manifest+json'
          curl -fsSI http://127.0.0.1:8080/sw.js | grep -qi '^cache-control: no-cache'
          # Nothing but the runtime files in the web root.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/package.json)" = 404
          echo "smoke test passed"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
